---
- name: ContactBook's Full DevOps Setup (K3s + Helm + Monitoring + App)
  hosts: all
  become: yes

  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  tasks:
   
    - name: Copy K8s files to server
      copy:
        src: /Users/jagdish/Documents/DevOpsClassCodes/k8s/
        dest: /home/ubuntu/k8s/

    - name: Copy Monitoring files
      copy:
        src: /Users/jagdish/Documents/DevOpsClassCodes/monitoring/
        dest: /home/ubuntu/monitoring/

    - name: Copy Output
      copy:
        src: ../target/addressbook.war
        dest: /home/ubuntu/target/    

    - name: Install K3s
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s


    - name: Wait for node to be ready
      shell: kubectl get nodes
      register: result
      retries: 10
      delay: 10
      until: result.rc == 0


    - name: Install Helm
      shell: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm


    - name: Add Prometheus Helm repo
      shell: |
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo update


    - name: Install Prometheus Stack
      shell: |
        helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
        -n monitoring \
        --create-namespace \
        -f /home/ubuntu/monitoring/values.yml


    - name: Apply Deployment
      command: kubectl apply -f /home/ubuntu/k8s/deployment.yml

    - name: Apply Service
      command: kubectl apply -f /home/ubuntu/k8s/service.yml


    - name: Apply ServiceMonitor
      command: kubectl apply -f /home/ubuntu/monitoring/serviceMonitor.yml

    - name: Inject dashboard to Grafana
      shell: |
        kubectl create configmap grafana-dashboard \
        --from-file=dashboard.json=/home/ubuntu/monitoring/dashboard.json \
        -n monitoring \
        --dry-run=client -o yaml | kubectl apply -f -
    
    - name: Label configmap
      shell: |
        kubectl label configmap grafana-dashboard \
        grafana_dashboard=1 \
        -n monitoring \
        --overwrite
       